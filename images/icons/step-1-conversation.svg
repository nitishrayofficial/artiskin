  <!-- secondary tail -->
  <path d="M62 66 L68 74 L57 66" stroke="#B85C38" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
  <!-- dots in primary -->
  <circle cx="34" cy="42" r="2.2" fill="#7A5C44" opacity="0.55"/>
  <circle cx="42" cy="42" r="2.2" fill="#7A5C44" opacity="0.55"/>
  <circle cx="50" cy="42" r="2.2" fill="#7A5C44" opacity="0.55"/>
  <!-- dots in secondary -->
  <circle cx="51" cy="55" r="1.7" fill="#B85C38" opacity="0.65"/>
  <circle cx="57" cy="55" r="1.7" fill="#B85C38" opacity="0.65"/>
  <circle cx="63" cy="55" r="1.7" fill="#B85C38" opacity="0.65"/>
</svg>
