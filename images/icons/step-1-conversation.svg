  <rect x="22" y="28" width="40" height="28" rx="6" stroke="#7A5C44" stroke-width="1.8" fill="none"/>
  <!-- primary tail -->
  <path d="M32 56 L27 67 L40 56" stroke="#7A5C44" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <!-- secondary bubble (offset, terracotta) -->
